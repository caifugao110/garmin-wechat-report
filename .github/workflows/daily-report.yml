name: Garmin Daily Report

on:
  schedule:
    # 主触发：UTC 23:40 = 北京 07:40
    - cron: '40 23 * * *'
    # 备用触发：UTC 23:50 = 北京 07:50
    # GitHub 的 schedule 在高峰期可能延迟甚至被直接丢弃；
    # 工作流开头会检查 12 小时内是否已有成功的定时运行，有则自动跳过，避免重复推送。
    - cron: '50 23 * * *'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Check whether a scheduled run already succeeded recently
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          now = datetime.datetime.now(datetime.timezone.utc)
          url = (
              f"https://api.github.com/repos/{repo}"
              "/actions/workflows/daily-report.yml/runs?event=schedule&per_page=20"
          )
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "garmin-daily-report",
          })
          with urllib.request.urlopen(req, timeout=30) as resp:
              runs = json.load(resp).get("workflow_runs", [])

          succeeded = []
          for r in runs:
              if r.get("conclusion") != "success":
                  continue
              if str(r.get("id")) == run_id:
                  continue
              created = datetime.datetime.fromisoformat(
                  r["created_at"].replace("Z", "+00:00"))
              if 0 <= (now - created).total_seconds() < 12 * 3600:
                  succeeded.append(r)

          if succeeded:
              print(f"::notice::12 小时内已有成功的定时运行（run id: {succeeded[0]['id']}），本次触发自动跳过，避免重复推送。")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  f.write("SKIP_REPORT=true\n")
          else:
              print("12 小时内没有成功的定时运行，继续执行报告。")
          PY

      - uses: actions/setup-node@v5
        if: env.SKIP_REPORT != 'true'
        with:
          node-version: '24'
          cache: 'npm'

      - name: Check credentials
        if: env.SKIP_REPORT != 'true'
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_OAUTH1_TOKEN: ${{ secrets.GARMIN_OAUTH1_TOKEN }}
        run: |
          if [ -n "$GARMIN_OAUTH1_TOKEN" ] || { [ -n "$GARMIN_USERNAME" ] && [ -n "$GARMIN_PASSWORD" ]; }; then
            echo "凭据检查通过"
          else
            echo "::error::未配置凭据。请在 Settings → Secrets and variables → Actions 配置 GARMIN_OAUTH1_TOKEN（推荐，本机执行 npm run token 生成），或配置 GARMIN_USERNAME + GARMIN_PASSWORD。详见 README。"
            exit 1
          fi

      - name: Install dependencies
        if: env.SKIP_REPORT != 'true'
        run: npm ci

      - name: Run report
        if: env.SKIP_REPORT != 'true'
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          GARMIN_OAUTH1_TOKEN: ${{ secrets.GARMIN_OAUTH1_TOKEN }}
          GARMIN_OAUTH1_TOKEN_SECRET: ${{ secrets.GARMIN_OAUTH1_TOKEN_SECRET }}
          # 可选：企业微信群机器人 Webhook key
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
          # 可选：DeepSeek / OpenAI 兼容 AI 分析
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          # 可选：体重数据 COS 公有读根地址（与 Cloudflare Worker 一致，数据由 SCF /webhook/weight 写入 COS）
          # 配置后日报展示「体重与体成分」；bucket 公有读私有写，非敏感配置可明文写入
          COS_WEIGHT_BASE_URL: ${{ secrets.COS_WEIGHT_BASE_URL }}
          TZ: Asia/Shanghai
        run: npx tsx src/index.ts
